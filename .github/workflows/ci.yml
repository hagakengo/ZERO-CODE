name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app api
      - name: Run isolated SQLite tests
        env:
          ZERO_CODE_SKIP_SEED: '1'
          ZERO_CODE_READ_TOKEN: ci-test-only-token-not-for-production
        run: python -m unittest discover -p 'test*.py' -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Run Production Canvas tests
        run: npm run test:canvas
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Build Next.js
        run: npm run build

  dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Run npm audit
        id: npm-audit
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          audit_exit_code=$?
          set -e
          echo "$audit_exit_code" > npm-audit-exit-code.txt
          echo "npm audit exit code: $audit_exit_code"
          exit "$audit_exit_code"
      - name: Upload npm audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          path: |
            frontend/npm-audit.json
            frontend/npm-audit-exit-code.txt
          if-no-files-found: error
