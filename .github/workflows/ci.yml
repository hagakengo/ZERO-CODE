name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app api
      - name: Run isolated SQLite tests
        env:
          ZERO_CODE_SKIP_SEED: '1'
          ZERO_CODE_READ_TOKEN: ci-test-only-token-not-for-production
        run: python -m unittest discover -p 'test*.py' -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Build Next.js with dummy secret canaries
        env:
          ZERO_CODE_WRITE_TOKEN: integration-only-write-secret
          ZERO_CODE_READ_TOKEN: integration-only-read-secret
          ZERO_CODE_ADMIN_PASSWORD: integration-only-admin-password
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r ../backend/requirements.txt
      - name: Next.js and FastAPI isolated authentication integration
        run: python ../tests/test_dashboard_auth.py
